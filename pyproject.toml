[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naijalingo"
version = "2.0.1"
description = "Official Python SDK for 9jaLingo — AI-powered Text-to-Speech and Voice Cloning for Nigerian languages including Hausa, Igbo, Yoruba, and Nigerian Pidgin with 240+ speaker voices."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "9jaLingo", email = "support@9jalingo.org" },
]
keywords = [
    "tts",
    "text-to-speech",
    "speech-synthesis",
    "voice-cloning",
    "nigerian",
    "african-languages",
    "hausa",
    "igbo",
    "yoruba",
    "pidgin",
    "naija",
    "ai",
    "speech",
    "nlp",
    "deep-learning",
    "machine-learning",
    "naijalingo",
    "9jalingo",
    "openai-compatible",
    "voice-ai",
    "multilingual",
    "nigeria",
    "african-nlp",
    "speech-api",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://www.9jalingo.org"
Documentation = "https://api.9jalingo.org"
Repository = "https://github.com/9jaLingo/naijalingo-python"
Issues = "https://github.com/9jaLingo/naijalingo-python/issues"
Website = "https://www.9jalingo.org"

[tool.hatch.build.targets.wheel]
packages = ["src/naijalingo"]
